name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # Every Carbon app installs this package and gates on what it returns, so a
      # regression here silently changes who can reach what, everywhere. The
      # fail-closed cases are the ones worth keeping green.
      - name: Test
        run: pnpm test

      - name: Format
        run: pnpm run format:check
